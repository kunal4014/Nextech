name: Sync premium Nextech reference build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-premium-reference.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download exact premium reference page
        run: |
          curl -L --fail --retry 3             "https://nextech-premium-reference-8817ibgff-k-3dd5.vercel.app"             -o index.html

      - name: Verify downloaded page
        run: |
          test -s index.html
          BYTES=$(wc -c < index.html)
          echo "Downloaded $BYTES bytes"
          test "$BYTES" -gt 100000

      - name: Commit synced build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync premium Nextech reference build"
            git push
          fi
